[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-golden"
version = "0.1.0"
description = "Golden-set evals with deterministic graders, a locked test split and judge calibration."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Oğuzhan Balım" }]
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
anthropic = ["anthropic"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
llm-golden = "llm_golden.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_golden"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
